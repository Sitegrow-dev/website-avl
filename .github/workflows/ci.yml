name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Valeurs en dur pour la CI (build jetable). La prod utilise l'env Vercel.
      # NB: le secret repo SITE_URL est invalide → on ne le référence pas ici.
      SITE_URL: https://afvl.org
      SITE_DOMAIN: afvl.org
      CONTACT_EMAIL: info@afvl.org
      HOLDING_API_KEY: ${{ secrets.HOLDING_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.12.0'
          cache: npm
      - run: npm ci
      - run: npx astro check
      - run: npm run build
